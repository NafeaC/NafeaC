name: Update Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run manually from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Animated stats / languages / activity cards (brand colors)
      - name: Generate cards
        env:
          # Optional: add a Personal Access Token as secret GH_PAT to include private contributions
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
        run: python scripts/generate_cards.py

      # Contribution snake (brand colors)
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF5757&color_dots=#EBEDF0,#FFD1D1,#FFA3A3,#FF7A7A,#FF5757
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF5757&color_dots=#1E1E1E,#4A2222,#7A3333,#B84545,#FF5757

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
